# Node 22/npm ci, static/contract gates, production build and mobile Chromium.
# Disposable database/provider/device verification is an explicit separate gate.
# Supabase placeholders support anonymous smoke paths only.
# See docs/environment-and-ci.md and docs/task-16-verification.md.

name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    env:
      CI: true
      PLAYWRIGHT_BROWSERS_PATH: 0
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://ci-placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0' }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'http://127.0.0.1:3000' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: PLAYWRIGHT_BROWSERS_PATH=0 npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Royal 3D assets
        run: npm run validate:royal-3d-assets

      - name: Contract tests
        run: npm run test:contracts

      - name: Build
        run: npm run build

      - name: E2E smoke tests
        run: npm run test:e2e -- --project=mobile-chrome
